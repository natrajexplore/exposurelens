[project]
name = "exposurelens"
version = "0.1.0"
description = "Multi-agent network exposure triage: NVIDIA Nemotron on Nebius Token Factory proves, line by line, whether a device config is exposed to an advisory."
readme = "README.md"
license = "MIT"
authors = [
    { email = "natrajexplore@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "tavily-python>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
